<!doctype html><meta charset="utf-8"><title>Crane browser regression</title><style>body{background:#101d23;color:#eee;font:15px system-ui}iframe{border:0;width:1100px;height:940px;max-width:100%}pre{white-space:pre-wrap}</style><h1>Crane browser regression</h1><p>Automated input replay and rendering checks. This is not human feel testing.</p><button id="run">Run checks</button><pre id="log">Loading…</pre><iframe src="../index.html" title="Crane test yard"></iframe><script>
const frame=document.querySelector('iframe'),log=document.querySelector('#log');let ready=false;frame.onload=()=>{ready=true;log.textContent='Ready. Run checks.'};document.querySelector('#run').onclick=async()=>{if(!ready)return;log.textContent='';const w=frame.contentWindow,d=w.document;let errors=[];w.addEventListener('error',e=>errors.push(e.message));function check(name,fn){try{fn();log.textContent+='PASS '+name+'\n'}catch(e){log.textContent+='FAIL '+name+': '+e.message+'\n'}}const a=w.eval('({reset,step,draw,updateUI,hookAction,togglePause,keys,get s(){return state}})');function assert(v){if(!v)throw Error('Assertion failed')}function run(t,keys=[]){a.keys.clear();keys.forEach(k=>a.keys.add(k));for(let i=0;i<Math.round(t*120);i++)a.step();a.keys.clear()}function route(){run(2.5,['w']);run(3.85,['d']);run(3);run(2.5,['s']);run(5);a.hookAction();run(3);a.updateUI();a.draw();assert(a.s.won)}
check('full success route + visible success overlay',()=>{a.reset();d.querySelector('#hook').click();route();assert(d.querySelector('#overlay').style.display==='grid')});
check('restart button and real keyboard hook handler',()=>{d.querySelector('#reset').click();assert(!a.s.won&&a.s.time===0);w.dispatchEvent(new w.KeyboardEvent('keydown',{key:' '}));assert(a.s.attached)});
check('drop, rehook, complete recovery route',()=>{run(1,['w']);a.hookAction();run(3);run(1,['s']);a.hookAction();assert(a.s.attached);route()});
check('pause/resume UI, focus loss, reset',()=>{d.querySelector('#reset').click();d.querySelector('#pause').click();run(2,['d']);assert(a.s.time===0);d.querySelector('#pause').click();run(.1);assert(a.s.time>0);w.dispatchEvent(new w.Event('blur'));assert(a.s.paused&&a.keys.size===0);d.querySelector('#reset').click();assert(!a.s.paused)});
for(const width of [390,768,1100]){frame.style.width=width+'px';await new Promise(r=>setTimeout(r,100));check('layout '+width+' px and canvas redraw',()=>{a.draw();assert(d.documentElement.scrollWidth<=width);assert(d.querySelector('canvas').width>0);assert(d.querySelector('#hook').getBoundingClientRect().width>0)})}
check('no uncaught browser errors',()=>assert(errors.length===0));a.reset();a.hookAction();route();log.textContent+='DONE — full route replay visible below.\n';};
</script>
